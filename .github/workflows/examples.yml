name: Examples

on: [push, pull_request]

jobs:
  modes-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 extras/gen_modes.py --check

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:renesas_uno:minima
          sketch-paths: examples
