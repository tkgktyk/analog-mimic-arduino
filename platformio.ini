[platformio]
default_envs = BasicRead

[env]
platform = renesas-ra
board = uno_r4_minima
framework = arduino
monitor_speed = 115200
; Use this repository itself as a library
lib_deps = symlink://.
; Switch the source directory to the selected example before building
extra_scripts = pre:select_example.py
; Enable extra warnings for library development
build_flags = -Wall -Wextra

; Builds the example whose .ino is open in the editor (via VS Code task)
[env:current]

[env:BasicRead]
custom_example = BasicRead

[env:ContinuousRead]
custom_example = ContinuousRead

[env:CpuCycles]
custom_example = CpuCycles

[env:Decimation]
custom_example = Decimation

[env:I2CScanner]
custom_example = I2CScanner

[env:Modes]
custom_example = Modes

[env:Amplifier]
custom_example = Amplifier

[env:Clipper]
custom_example = Clipper

[env:Comparator]
custom_example = Comparator

[env:ConstantVoltage]
custom_example = ConstantVoltage

[env:Differentiator]
custom_example = Differentiator

[env:Envelope]
custom_example = Envelope

[env:Filter1st]
custom_example = Filter1st

[env:FilterBiquad]
custom_example = FilterBiquad

[env:Integrator]
custom_example = Integrator

[env:Rectifier]
custom_example = Rectifier
