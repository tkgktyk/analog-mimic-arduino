[platformio]
default_envs = BasicRead

[env]
platform = renesas-ra
board = uno_r4_minima
framework = arduino
monitor_speed = 115200
; Use this repository itself as a library
lib_deps = symlink://.
; Switch the source directory to the selected example before building
extra_scripts = pre:select_example.py
; Enable extra warnings for library development
build_flags = -Wall -Wextra

; Builds the example whose .ino is open in the editor (via VS Code task)
[env:current]

[env:BasicRead]
custom_example = BasicRead

[env:ContinuousRead]
custom_example = ContinuousRead

[env:CpuCycles]
custom_example = CpuCycles

[env:Decimation]
custom_example = Decimation

[env:I2CScanner]
custom_example = I2CScanner

[env:Modes]
custom_example = Modes
